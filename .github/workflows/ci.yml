name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  # A workflow that fails to PARSE reports nothing at all: no red cross, no
  # run, just silence. actionlint is what turns that silence into a failure.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" -color

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod

  # Linux is where the real syscalls are: an unlinked file on a tmpfs mapped
  # MAP_SHARED, and SCM_RIGHTS over a real unix socket. Both are exercised
  # against the kernel, not against a stub.
  linux:
    name: linux (real syscalls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go build ./...
      - name: Unit tests
        run: go test -count=1 -coverprofile=cover.out ./...
      - name: 100% coverage gate
        shell: bash
        run: ./.github/coverage-gate.sh cover.out
      - name: Race (CGO=1)
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: "1"

  # darwin and windows are not an afterthought: the whole codec is portable and
  # is exercised here against an in-process scripted server, so a protocol bug
  # shows up on a machine that has never seen an X server. windows is also the
  # only lane that builds the no-unix-socket transport stub.
  darwin:
    name: darwin (unix transport + the whole codec)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go test -count=1 -coverprofile=cover.out ./...
      - name: 100% coverage gate
        shell: bash
        run: ./.github/coverage-gate.sh cover.out

  windows:
    name: windows (stubs + the whole codec)
    runs-on: windows-latest
    # Every step here runs under bash. PowerShell is the default on a windows
    # runner and it re-tokenises `-coverprofile=cover.out ./...` into two
    # package arguments, so the run fails on a package named ".out" that no
    # amount of Go code can fix.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go vet ./...
      - run: go test -count=1 -coverprofile=cover.out ./...
      - name: 100% coverage gate
        run: ./.github/coverage-gate.sh cover.out

  # Every target a consumer builds for must compile, including the ones with no
  # unix socket at all: a toolkit cross-compiles this without thinking about it.
  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: android, goarch: arm64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - run: go vet ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  # The wire order is the CLIENT's choice, and both halves of that choice have
  # to work on a machine whose own order is the other one. s390x under qemu is
  # where the big-endian path is actually executed rather than merely compiled.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: s390x, qemu: qemu-s390x-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      # `env:` is above `run:` on purpose: the resolver below is a block scalar,
      # and a sibling key after it would be read as part of the script.
      - name: Test under qemu (${{ matrix.goarch }})
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          go test -exec="$q" -count=1 ./...
